# Ablation: Group 3 — Sparse Compensation + L3.0 Loss
# Dataset: ScienceQA, Model: Qwen2.5-Omni-3B
model:
  model_path: /private/wy/pretrained_models/Qwen2.5-Omni-3B
  quant_method: morpho
  apply_hooks: false
  save_attention_maps: false
  save_per_head_attention: false
quant:
  simulate_hif8: false
  activation_bitwidth: 4
  keep_special_layer: false
  debug_quant_act: false
  gamma_inf: 0.5
  gamma_cos: 1.0
  lp_norm: 3.0
  use_cosine_loss: false
  search_ratio_lower_bound: 0.6
  calib_size: 64
  search_size: 8
  batch_size: 8
data:
  only_samples_with_images: false
  num_samples: -1
run:
  save_dir: /private/wy/logs/MorphoQuant/ablation/sparse_l3/scienceqa_results
  seed: 2025
