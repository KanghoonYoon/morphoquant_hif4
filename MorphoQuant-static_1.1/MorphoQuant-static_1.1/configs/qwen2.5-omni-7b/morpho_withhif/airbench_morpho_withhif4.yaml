model:
  model_path: /private/wy/pretrained_models/Qwen2.5-Omni-7B
  quant_method: morpho_withhif4
  apply_hooks: false
  save_attention_maps: false
  save_per_head_attention: false
quant:
  simulate_hif8: false
  simulate_hif4: true
  activation_bitwidth: 4
  keep_special_layer: false
  debug_quant_act: false
  gamma_inf: 0.5
  gamma_cos: 1.0
  lp_norm: 3.0
  calib_size: 128
  search_size: 16
  batch_size: 4
  sparse_buffer_ratio: 1.5
  search_ratio_lower_bound: 0.6
  outlier_std_threshold: 2.0
  use_cosine_loss: false
data:
  only_samples_with_images: false
  num_samples: -1
  data_root: /private/wy/datasets/air-bench/Foundation
  output_file: /private/wy/logs/MorphoQuant/airbench/Foundation_result_qwen2.5_omni_7b_hif4.jsonl
  run_pca: false
run:
  save_dir: /private/wy/pretrained_models/qwen2.5-omni-7b-4bit-calibrated
  seed: 2025
